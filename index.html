<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="Прокляття Онлайн — інтерактивний сатиричний розважальний проєкт.">
  <title>Прокляття Онлайн</title>
  <style>
    :root{
      --bg:#050505;
      --panel:#0b0b0c;
      --panel2:#101013;
      --text:#fff;
      --muted:#c7c7cb;
      --red:#f6534a;
      --red2:#ff7268;
      --line:rgba(255,255,255,.16);
      --shadow:0 28px 90px rgba(0,0,0,.58);
      --radius:32px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,Arial,Helvetica,sans-serif}
    body{overflow-x:hidden}
    button,input{font:inherit}
    button{-webkit-tap-highlight-color:transparent}
    .app{
      min-height:100svh;
      background:
        radial-gradient(circle at 74% 25%,rgba(255,93,76,.08),transparent 24%),
        radial-gradient(circle at 22% 16%,rgba(255,255,255,.045),transparent 28%),
        linear-gradient(180deg,#080809 0%,#040404 100%);
      position:relative;
      isolation:isolate;
    }
    .app:after{
      content:"";
      position:fixed;inset:0;pointer-events:none;z-index:30;opacity:.035;
      background-image:radial-gradient(rgba(255,255,255,.55) .55px,transparent .55px);
      background-size:4px 4px;
      mix-blend-mode:soft-light;
    }
    .shell{
      width:min(1460px,calc(100% - 48px));
      min-height:calc(100svh - 48px);
      margin:24px auto;
      position:relative;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.06);
      border-radius:var(--radius);
      background:
        linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.008)),
        rgba(9,9,10,.88);
      box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.035);
    }
    .shell:before{
      content:"";position:absolute;inset:0;pointer-events:none;
      background:
        radial-gradient(circle at 75% 70%,rgba(255,83,66,.06),transparent 24%),
        radial-gradient(circle at 22% 25%,rgba(255,255,255,.025),transparent 28%);
    }
    .topbar{
      position:absolute;left:26px;top:24px;z-index:20;display:flex;align-items:center;gap:14px
    }
    .burger{
      width:48px;height:48px;border:0;border-radius:14px;background:transparent;cursor:pointer;
      display:grid;place-items:center;transition:.2s ease
    }
    .burger:hover{background:rgba(255,255,255,.06)}
    .burger-lines{width:28px;height:22px;display:flex;flex-direction:column;justify-content:space-between}
    .burger-lines i{display:block;width:100%;height:4px;border-radius:99px;background:#fff}
    .screens{position:relative;min-height:calc(100svh - 48px)}
    .screen{display:none;min-height:calc(100svh - 48px);position:relative;z-index:2}
    .screen.active{display:grid}

    /* HOME */
    .home{
      grid-template-columns:minmax(440px,.95fr) minmax(420px,1.05fr);
      align-items:center;gap:54px;padding:88px 74px 70px
    }
    .home-copy{width:100%;max-width:650px;justify-self:center}
    .title{
      margin:0;font-size:clamp(50px,5.4vw,92px);line-height:.9;letter-spacing:-.07em;
      font-weight:1000;text-transform:uppercase;white-space:nowrap;
      text-shadow:0 0 18px rgba(255,255,255,.08)
    }
    .subtitle{
      margin:14px 0 0;font-size:clamp(19px,1.65vw,31px);font-weight:800;line-height:1.15;color:#f1f1f2
    }
    .actions{display:flex;flex-direction:column;gap:17px;margin-top:44px;max-width:590px}
    .pill{
      width:100%;height:82px;border:0;border-radius:999px;color:#fff;font-weight:950;
      font-size:clamp(24px,2.1vw,39px);cursor:pointer;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease
    }
    .pill:hover{transform:translateY(-2px);filter:brightness(1.05)}
    .pill:active{transform:translateY(0) scale(.995)}
    .primary{
      background:linear-gradient(180deg,#ff665b 0%,#ec4a41 100%);
      box-shadow:0 12px 38px rgba(242,79,68,.28),inset 0 1px 0 rgba(255,255,255,.16)
    }
    .secondary{
      color:#fff;background:linear-gradient(180deg,#b6bcc3 0%,#949ba3 100%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 24px rgba(0,0,0,.18)
    }
    .count{margin-top:20px;text-align:center;font-weight:800;font-size:16px;color:#f5f5f5;max-width:590px}
    .count b{font-size:18px}
    .range-wrap{max-width:590px;margin-top:32px}
    .range{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:999px;outline:0;background:#efeff1}
    .range::-webkit-slider-thumb{-webkit-appearance:none;width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.35);cursor:pointer}
    .range::-moz-range-thumb{width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.35);cursor:pointer}
    .home-visual{display:grid;place-items:center;min-height:660px}
    .sigil-stage{width:min(90%,610px);aspect-ratio:1;position:relative;display:grid;place-items:center}
    .sigil-aura{
      position:absolute;inset:17%;border-radius:50%;
      background:radial-gradient(circle,rgba(255,167,87,.62) 0%,rgba(255,92,34,.28) 40%,transparent 72%);
      filter:blur(42px);animation:aura 2.8s ease-in-out infinite
    }
    .sigil{width:100%;height:100%;position:relative;filter:drop-shadow(0 0 16px rgba(255,111,53,.78)) drop-shadow(0 0 42px rgba(255,89,35,.35));animation:float 5.8s ease-in-out infinite}
    .flame{transform-origin:250px 250px;animation:flame 1.35s ease-in-out infinite alternate}
    @keyframes aura{50%{transform:scale(1.08);opacity:.78}}
    @keyframes float{50%{transform:translateY(-11px)}}
    @keyframes flame{from{opacity:.72;transform:scale(.985)}to{opacity:1;transform:scale(1.02)}}

    /* RITUAL */
    .ritual{
      grid-template-columns:minmax(450px,.93fr) minmax(430px,1.07fr);
      align-items:center;gap:42px;padding:86px 70px 58px
    }
    .ritual-copy{width:100%;max-width:640px;justify-self:center}
    .ritual-head{display:flex;align-items:flex-start;gap:16px}
    .mark{width:42px;display:flex;flex-direction:column;gap:5px;flex:0 0 auto;margin-top:9px}
    .mark i{height:6px;border-radius:999px;background:#fff;display:block}
    .mark i:nth-child(1){width:33px}.mark i:nth-child(2){width:39px}.mark i:nth-child(3){width:27px}
    .ritual-title{font-size:clamp(42px,4.6vw,76px)}
    .ritual-sub{margin:12px 0 36px 58px;font-size:18px;font-weight:800;color:#f3f3f3}
    .field{margin-bottom:17px}
    .field label{display:block;margin:0 0 8px 34px;font-size:16px;font-weight:850;color:#f3f3f4}
    .field-wrap{position:relative}
    .field input{
      width:100%;height:78px;border-radius:999px;border:4px solid rgba(255,255,255,.95);
      background:rgba(255,255,255,.025);color:#fff;outline:0;padding:0 34px;font-size:20px;
      transition:border-color .22s ease,box-shadow .22s ease,background .22s ease,transform .22s ease
    }
    .field input:focus{
      background:rgba(255,255,255,.045);transform:scale(1.004);
      box-shadow:0 0 0 1px #fff,0 0 25px rgba(255,255,255,.12)
    }
    .field input::placeholder{color:rgba(255,255,255,.2)}
    .field-wrap.random input{padding-right:90px}
    .random-btn{
      position:absolute;right:15px;top:50%;transform:translateY(-50%);
      width:50px;height:50px;border:0;border-radius:50%;background:transparent;color:#fff;
      font-size:36px;line-height:1;cursor:pointer;transition:.25s ease
    }
    .random-btn:hover{background:rgba(255,255,255,.07);transform:translateY(-50%) rotate(180deg)}
    .ritual-trigger{display:block;width:calc(100% - 60px);height:42px;margin:0 auto;border:0;background:transparent;cursor:pointer;position:relative}
    .ritual-trigger:before{
      content:"";position:absolute;left:0;right:0;top:50%;height:4px;border-radius:999px;transform:translateY(-50%);
      background:linear-gradient(90deg,#ff8d82,#f14b42,#ff8d82);
      box-shadow:0 0 10px rgba(242,76,67,.8),0 0 34px rgba(242,76,67,.28);
      transition:.22s ease
    }
    .ritual-trigger:hover:before{height:7px;box-shadow:0 0 16px rgba(242,76,67,.95),0 0 48px rgba(242,76,67,.42)}
    .ritual-visual{min-height:670px;display:grid;place-items:center}
    .pot-stage{position:relative;width:min(90%,690px);aspect-ratio:1/1}
    .pot-glow{
      position:absolute;left:17%;right:17%;bottom:9%;height:24%;border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,.17),rgba(255,255,255,.045) 42%,transparent 72%);
      filter:blur(36px)
    }
    .pot-svg{
      position:absolute;inset:10% 3% 0;width:94%;height:88%;overflow:visible;
      filter:drop-shadow(0 20px 35px rgba(0,0,0,.6));animation:potfloat 6.4s ease-in-out infinite
    }
    .smoke{position:absolute;left:50%;top:6%;width:320px;height:320px;transform:translateX(-50%);pointer-events:none}
    .smoke i{
      position:absolute;left:50%;bottom:24px;width:110px;height:110px;margin-left:-55px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,255,255,.28),rgba(210,210,210,.08) 46%,transparent 72%);
      filter:blur(13px);opacity:0;animation:smoke 5.2s ease-in-out infinite
    }
    .smoke i:nth-child(1){animation-delay:0s}.smoke i:nth-child(2){animation-delay:1.1s}.smoke i:nth-child(3){animation-delay:2.2s}.smoke i:nth-child(4){animation-delay:3.3s}
    @keyframes potfloat{50%{transform:translateY(-10px)}}
    @keyframes smoke{
      0%{opacity:0;transform:translate(-35px,65px) scale(.45)}
      20%{opacity:.55}
      68%{opacity:.17}
      100%{opacity:0;transform:translate(42px,-220px) scale(2.25)}
    }

    /* menu */
    .drawer{
      position:absolute;inset:0 auto 0 0;width:min(420px,88vw);z-index:40;padding:96px 28px 30px;
      background:rgba(8,8,9,.96);backdrop-filter:blur(18px);border-right:1px solid rgba(255,255,255,.07);
      transform:translateX(-102%);transition:transform .32s cubic-bezier(.2,.8,.2,1)
    }
    .drawer.open{transform:translateX(0)}
    .drawer h3{margin:0 0 24px;font-size:14px;text-transform:uppercase;letter-spacing:.16em;color:#9e9ea5}
    .nav-btn{
      width:100%;height:60px;border:0;border-bottom:1px solid rgba(255,255,255,.08);background:transparent;color:#fff;
      text-align:left;font-size:24px;font-weight:900;cursor:pointer
    }
    .nav-btn:hover{color:var(--red2)}
    .drawer-note{margin-top:26px;color:#a9a9af;font-size:13px;line-height:1.45}
    .shade{position:absolute;inset:0;z-index:35;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.25s ease}
    .shade.show{opacity:1;pointer-events:auto}

    /* toast */
    .toast{
      position:absolute;right:24px;bottom:24px;z-index:25;width:min(430px,calc(100% - 48px));
      padding:18px 19px;border-radius:20px;background:rgba(18,18,20,.94);border:1px solid rgba(255,255,255,.1);
      box-shadow:0 20px 55px rgba(0,0,0,.46);opacity:0;transform:translateY(16px);pointer-events:none;
      transition:.28s ease
    }
    .toast.show{opacity:1;transform:translateY(0)}
    .toast strong{display:block;margin-bottom:5px;font-size:16px}
    .toast span{color:#d2d2d6;font-size:14px;line-height:1.45}
    .disclaimer{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:10;color:#75757a;font-size:11px;white-space:nowrap}

    body.ritual-active .ritual-trigger:before{height:10px;box-shadow:0 0 20px rgba(255,78,66,1),0 0 70px rgba(255,78,66,.6)}
    body.ritual-active .pot-svg{animation:shake .11s linear 10,potfloat 6.4s ease-in-out infinite}
    body.ritual-active .smoke i{animation-duration:2.1s}
    @keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

    @media(max-width:980px){
      .shell{width:min(100% - 20px,620px);margin:10px auto;min-height:calc(100svh - 20px);border-radius:24px}
      .screens,.screen{min-height:calc(100svh - 20px)}
      .topbar{left:14px;top:14px}
      .burger{width:42px;height:42px}.burger-lines{width:24px;height:18px}.burger-lines i{height:3.5px}
      .home,.ritual{grid-template-columns:1fr;padding:78px 18px 66px;gap:8px}
      .home-copy,.ritual-copy{max-width:560px}
      .title{text-align:center;white-space:normal;font-size:clamp(38px,11vw,58px)}
      .subtitle{text-align:center;font-size:clamp(16px,4.8vw,22px)}
      .actions{margin-top:30px;gap:13px}
      .pill{height:66px;font-size:clamp(21px,6vw,29px)}
      .count{margin-top:16px}
      .range-wrap{margin-top:28px}
      .range::-webkit-slider-thumb{width:42px;height:42px}.range::-moz-range-thumb{width:42px;height:42px}
      .home-visual{min-height:330px;margin-top:4px}
      .sigil-stage{width:min(78vw,360px)}
      .ritual{padding-top:74px}
      .ritual-head{justify-content:center;gap:10px}
      .ritual-head .title{text-align:left}
      .ritual-title{font-size:clamp(35px,9.4vw,50px)}
      .mark{width:31px;margin-top:6px}.mark i{height:4px}.mark i:nth-child(1){width:25px}.mark i:nth-child(2){width:29px}.mark i:nth-child(3){width:20px}
      .ritual-sub{margin:8px 0 24px;text-align:center;font-size:14px}
      .field{margin-bottom:13px}.field label{font-size:14px;margin-left:22px;margin-bottom:6px}
      .field input{height:63px;border-width:3px;padding:0 24px;font-size:17px}
      .field-wrap.random input{padding-right:76px}
      .random-btn{right:12px;width:44px;height:44px;font-size:31px}
      .ritual-trigger{width:calc(100% - 42px);height:32px}
      .ritual-visual{min-height:390px;margin-top:-8px}
      .pot-stage{width:min(112%,520px);aspect-ratio:1.08/1}
      .smoke{top:-2%;transform:translateX(-50%) scale(.74)}
      .disclaimer{font-size:10px;bottom:8px}
      .toast{right:12px;bottom:12px;width:calc(100% - 24px)}
    }
    @media(max-width:420px){
      .home,.ritual{padding-left:14px;padding-right:14px}
      .pill{height:61px}
      .field input{height:59px}
      .home-visual{min-height:290px}
      .ritual-visual{min-height:340px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="shell">
      <div class="topbar">
        <button class="burger" id="burger" type="button" aria-label="Відкрити меню" aria-expanded="false">
          <span class="burger-lines"><i></i><i></i><i></i></span>
        </button>
      </div>

      <div class="shade" id="shade"></div>
      <aside class="drawer" id="drawer" aria-hidden="true">
        <h3>Меню</h3>
        <button class="nav-btn" type="button" data-go="home">Головна</button>
        <button class="nav-btn" type="button" data-go="ritual">Проклясти</button>
        <p class="drawer-note">Сатиричний розважальний проєкт. Не сприймайте ритуали буквально.</p>
      </aside>

      <div class="screens">
        <section class="screen home active" id="home">
          <div class="home-copy">
            <h1 class="title">ПРОКЛЯТТЯ ОНЛАЙН</h1>
            <p class="subtitle">Одне натискання — і всесвіт усе владнає!</p>

            <div class="actions">
              <button class="pill primary" id="start" type="button">Проклясти</button>
              <button class="pill secondary" id="energy" type="button">Підкинути енергію</button>
            </div>

            <div class="count">Накладено заклять: <b id="count">4 351</b></div>

            <div class="range-wrap">
              <input class="range" id="range" type="range" min="0" max="100" value="18" aria-label="Рівень енергії">
            </div>
          </div>

          <div class="home-visual" aria-hidden="true">
            <div class="sigil-stage" id="sigilStage">
              <div class="sigil-aura"></div>
              <svg class="sigil" viewBox="0 0 500 500" role="img">
                <defs>
                  <radialGradient id="g1">
                    <stop offset="0" stop-color="#ffd59a"/>
                    <stop offset=".45" stop-color="#ff973e"/>
                    <stop offset="1" stop-color="#ff4e24"/>
                  </radialGradient>
                  <filter id="rough">
                    <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="7" result="n"/>
                    <feDisplacementMap in="SourceGraphic" in2="n" scale="8"/>
                  </filter>
                </defs>
                <g class="flame" filter="url(#rough)">
                  <circle cx="250" cy="250" r="178" stroke="url(#g1)" stroke-width="23" fill="none"/>
                  <circle cx="250" cy="250" r="148" stroke="#ffb15f" stroke-opacity=".68" stroke-width="6" fill="none"/>
                  <path d="M250 91L288 206H410L311 277L349 394L250 323L151 394L189 277L90 206H212L250 91Z"
                        stroke="url(#g1)" stroke-width="21" stroke-linejoin="round" fill="none"/>
                  <path d="M250 128C234 154 234 177 250 199C267 174 268 151 250 128ZM155 222C172 230 184 244 190 264C164 262 147 248 155 222ZM345 222C353 248 336 262 310 264C316 244 328 230 345 222ZM198 332C214 316 231 308 250 308C241 335 224 347 198 332ZM302 332C276 347 259 335 250 308C269 308 286 316 302 332Z"
                        fill="#ff9d4d" opacity=".9"/>
                </g>
              </svg>
            </div>
          </div>
        </section>

        <section class="screen ritual" id="ritual">
          <div class="ritual-copy">
            <div class="ritual-head">
              <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
              <h2 class="title ritual-title">ПРОКЛЯТТЯ ОНЛАЙН</h2>
            </div>
            <p class="ritual-sub">Введіть імʼя, причину і покарання</p>

            <form id="ritualForm" autocomplete="off">
              <div class="field">
                <label for="who">Кого проклинаємо?</label>
                <div class="field-wrap"><input id="who" name="who" type="text" maxlength="80"></div>
              </div>

              <div class="field">
                <label for="why">Що вона(він) зробила(в)?</label>
                <div class="field-wrap"><input id="why" name="why" type="text" maxlength="140"></div>
              </div>

              <div class="field">
                <label for="punishment">Яка кара?</label>
                <div class="field-wrap random">
                  <input id="punishment" name="punishment" type="text" maxlength="140">
                  <button class="random-btn" id="random" type="button" aria-label="Випадкова кара">↻</button>
                </div>
              </div>

              <button class="ritual-trigger" type="submit" aria-label="Запустити ритуал"></button>
            </form>
          </div>

          <div class="ritual-visual" aria-hidden="true">
            <div class="pot-stage">
              <div class="pot-glow"></div>
              <div class="smoke"><i></i><i></i><i></i><i></i></div>

              <svg class="pot-svg" viewBox="0 0 700 620">
                <defs>
                  <linearGradient id="potBody" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#f7f7f7"/>
                    <stop offset=".18" stop-color="#616168"/>
                    <stop offset=".38" stop-color="#101014"/>
                    <stop offset=".66" stop-color="#2f2f35"/>
                    <stop offset=".84" stop-color="#d7d7da"/>
                    <stop offset="1" stop-color="#17171b"/>
                  </linearGradient>
                  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#f3f3f5"/>
                    <stop offset=".3" stop-color="#3a3a40"/>
                    <stop offset=".55" stop-color="#0d0d10"/>
                    <stop offset=".78" stop-color="#8e8e95"/>
                    <stop offset="1" stop-color="#f3f3f5"/>
                  </linearGradient>
                  <radialGradient id="inside">
                    <stop offset="0" stop-color="#121216"/>
                    <stop offset=".62" stop-color="#050506"/>
                    <stop offset="1" stop-color="#000"/>
                  </radialGradient>
                  <filter id="softGlow">
                    <feGaussianBlur stdDeviation="9" result="b"/>
                    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                  </filter>
                </defs>

                <ellipse cx="350" cy="180" rx="246" ry="61" fill="#111115"/>
                <path d="M113 183C120 165 169 147 231 139C302 130 399 131 473 143C537 154 582 170 586 187C590 206 548 222 486 233C400 249 299 249 215 236C152 227 107 207 113 183Z"
                      fill="url(#rim)"/>
                <ellipse cx="350" cy="187" rx="214" ry="45" fill="url(#inside)"/>
                <ellipse cx="350" cy="189" rx="178" ry="28" fill="#050506"/>

                <path d="M140 202C145 309 164 403 221 489C262 551 435 556 480 492C541 405 560 307 562 202C520 232 447 248 350 248C254 248 180 233 140 202Z"
                      fill="url(#potBody)"/>

                <path d="M182 246C192 337 211 417 255 475" stroke="#fff" stroke-opacity=".34" stroke-width="13" stroke-linecap="round"/>
                <path d="M521 250C510 341 491 420 450 478" stroke="#fff" stroke-opacity=".14" stroke-width="8" stroke-linecap="round"/>

                <ellipse cx="350" cy="503" rx="133" ry="45" fill="#0a0a0d" opacity=".88"/>
                <path d="M230 489C248 523 284 547 350 551C416 548 453 525 474 490C444 507 407 516 351 516C295 516 259 508 230 489Z"
                      fill="#0d0d10"/>

      <div class="toast" id="toast" role="status" aria-live="polite">
        <strong>Ритуал завершено</strong>
        <span id="toastText">Закляття активовано.</span>
      </div>

      <div class="disclaimer">сатиричний розважальний проєкт</div>

  <script>
    (function(){
      var home=document.getElementById('home');
      var ritual=document.getElementById('ritual');
      var start=document.getElementById('start');
      var energy=document.getElementById('energy');
      var range=document.getElementById('range');
      var sigil=document.getElementById('sigilStage');
      var counter=document.getElementById('count');
      var form=document.getElementById('ritualForm');
      var random=document.getElementById('random');
      var punishment=document.getElementById('punishment');
      var toast=document.getElementById('toast');
      var toastText=document.getElementById('toastText');
      var burger=document.getElementById('burger');
      var drawer=document.getElementById('drawer');
      var shade=document.getElementById('shade');

      var punishments=[
        'Щоб Wi-Fi ловив тільки біля роутера',
        'Щоб кава завжди остигала за 30 секунд',
        'Щоб зарядка зникала саме коли треба',
        'Щоб будильник дзвонив у вихідний',
        'Щоб реклама не пропускалась',
        'Щоб доставка запізнювалась рівно на 11 хвилин',
        'Щоб після прання завжди губилась одна шкарпетка',
        'Щоб телефон падав тільки екраном вниз'
      ];

      function valueCount(){
        return parseInt(counter.textContent.replace(/\s/g,''),10)||4351;
      }
      function setCount(n){
        counter.textContent=new Intl.NumberFormat('uk-UA').format(n);
      }
      function go(screen){
        home.classList.remove('active');
        ritual.classList.remove('active');
        screen.classList.add('active');
        closeMenu();
        window.scrollTo({top:0,behavior:'smooth'});
      }
      function showToast(text){
        toastText.textContent=text;
        toast.classList.add('show');
        clearTimeout(window.__toastTimer);
        window.__toastTimer=setTimeout(function(){toast.classList.remove('show')},3300);
      }
      function openMenu(){
        drawer.classList.add('open');
        shade.classList.add('show');
        drawer.setAttribute('aria-hidden','false');
        burger.setAttribute('aria-expanded','true');
      }
      function closeMenu(){
        drawer.classList.remove('open');
        shade.classList.remove('show');
        drawer.setAttribute('aria-hidden','true');
        burger.setAttribute('aria-expanded','false');
      }

      start.addEventListener('click',function(){go(ritual)});
      energy.addEventListener('click',function(){
        setCount(valueCount()+1);
        var v=Math.min(100,Number(range.value)+10);
        range.value=String(v);
        sigil.style.transform='scale('+(1+v/500)+')';
        showToast('Енергію підкинуто. Символ став сильнішим.');
      });
      range.addEventListener('input',function(){
        var v=Number(range.value);
        sigil.style.transform='scale('+(1+v/500)+')';
      });
      random.addEventListener('click',function(){
        punishment.value=punishments[Math.floor(Math.random()*punishments.length)];
      });
      form.addEventListener('submit',function(e){
        e.preventDefault();
        var who=document.getElementById('who').value.trim()||'Невідомий персонаж';
        var why=document.getElementById('why').value.trim()||'таємничий вчинок';
        var p=punishment.value.trim()||'космічна кара';
        document.body.classList.remove('ritual-active');
        void document.body.offsetWidth;
        document.body.classList.add('ritual-active');
        setCount(valueCount()+1);
        showToast('Для «'+who+'» ритуал запущено. Причина: '+why+'. Кара: '+p+'.');
        setTimeout(function(){document.body.classList.remove('ritual-active')},2400);
      });
      burger.addEventListener('click',function(){
        if(drawer.classList.contains('open'))closeMenu();else openMenu();
      });
      shade.addEventListener('click',closeMenu);
      document.querySelectorAll('[data-go]').forEach(function(btn){
        btn.addEventListener('click',function(){
          go(btn.getAttribute('data-go')==='home'?home:ritual);
        });
      });
      document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu()});
    })();
  </script>
</body>
</html>
