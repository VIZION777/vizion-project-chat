<!doctype html>
<html lang="uk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000"><title>Прокляття Онлайн</title>
<link rel="stylesheet" href="./styles.css?v=13"></head><body>
<main class="app">
<button class="hamburger" id="menuToggle" type="button" aria-label="Меню"><span></span><span></span><span></span></button>
<div class="shade" id="shade"></div><aside class="drawer" id="drawer"><button data-go="home">Головна</button><button data-go="ritual">Проклясти</button></aside>

<section id="home" class="screen active home">
 <div class="homeInner">
  <h1>ПРОКЛЯТТЯ ОНЛАЙН</h1>
  <p class="subtitle">Одне натискання — і всесвіт усе владнає!</p>
  <button class="pill red" id="goRitual">Проклясти</button>
  <button class="pill gray" id="addEnergy">Підкинути енергію</button>
  <p class="count">Накладено заклять: <b id="count">4 351</b></p>
  <div class="fireStage codeFireStage" id="fireStage" style="--energy:.62">
    <img class="referenceDarkSphere" src="./assets/dark-reference-sphere.jpg?v=13" alt=""><video class="referenceFireVideo" id="fireVideo" src="./assets/fire-loop.mp4?v=12" autoplay muted loop playsinline preload="auto"></video>
<canvas class="codeFireCanvas" id="fireCanvas" aria-hidden="true"></canvas>
  </div>
  <input class="range" id="range" type="range" min="0" max="100" value="62" aria-label="Енергія">
 </div>
</section>

<section id="ritual" class="screen ritual">
 <div class="ritualInner">
  <div class="formCol">
   <h2>ПРОКЛЯТТЯ ОНЛАЙН</h2>
   <p class="ritualSub">Введіть імʼя, причину і покарання</p>
   <form id="ritualForm">
    <label><span>Кого проклинаємо?</span><input id="who" maxlength="80"></label>
    <label><span>Що вона(він) зробила(в)?</span><input id="why" maxlength="140"></label>
    <label><span>Яка кара?</span><div class="randomWrap"><input id="punishment" maxlength="140"><button id="random" type="button">↻</button></div></label>
    <button class="submit" type="submit">Проклясти</button>
   </form>
  </div>
  <div class="potCol"><img class="pot" src="./assets/cauldron-reference.jpg" alt=""></div>
 </div>
</section>
<div class="toast" id="toast"></div>
</main><script src="./script.js?v=13"></script></body></html>
