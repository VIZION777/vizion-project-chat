<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">

<title>Прокляття онлайн</title>
<link rel="stylesheet" href="./styles.css?v=refcopy1">
</head>
<body>
<button class="menu-btn" aria-label="Меню"><span></span><span></span><span></span></button>

<main class="page home-page">
  <section class="home-card">
    <h1>ПРОКЛЯТТЯ ОНЛАЙН</h1>
    <p class="subtitle">Одне натискання — і всесвіт усе владнає!</p>

    <a class="cta primary" href="./page-2/">Проклясти</a>
    <button class="cta secondary" id="cleanBtn" type="button">Очистити совість</button>

    <p class="counter">Накладено проклять: <strong>4 351</strong></p>

    <div class="pentagram-wrap" aria-hidden="true">

<div class="cookie" id="cookie">
  <div>
    <b>МАГІЧНІ КРИХТИ</b>
    <p>Ми використовуємо їх, щоб сайт пам’ятав твої прокляття і не забував закон балансу. Душу не забираємо — лише технічні байти.</p>
  </div>
  <button id="acceptCookie">Прийняти неминуче</button>
</div>

<script>
document.getElementById('acceptCookie').onclick=()=>document.getElementById('cookie').remove();
document.getElementById('cleanBtn').onclick=()=>alert('Совість очищено настільки, наскільки це технічно можливо.');
</script>
