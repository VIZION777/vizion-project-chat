<!doctype html>
<html lang="uk"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000"><title>Прокляття Онлайн</title>
<link rel="stylesheet" href="./styles.css?v=24"></head><body>
<main class="app">
<button class="hamburger" id="menuToggle" type="button" aria-label="Меню"><span></span><span></span><span></span></button>
<div class="shade" id="shade"></div><aside class="drawer" id="drawer"><button data-go="home">Головна</button><button data-go="ritual">Проклясти</button></aside>

<section id="home" class="screen active home">
 <div class="homeInner">
  <h1>ПРОКЛЯТТЯ ОНЛАЙН</h1>
  <p class="subtitle">Одне натискання — і всесвіт усе владнає!</p>
  <button class="pill red" id="goRitual">Проклясти</button>
  <button class="pill gray" id="addEnergy">Підкинути енергію</button>
  <p class="count">Накладено заклять: <b id="count">4 351</b></p>
  <div class="fireStage codeFireStage" id="fireStage" style="--energy:.62">
    <img class="sphereOff" src="https://gcdn.picsart.com/editing-temp/a3dcd72f-cf65-4d24-ab67-484cf2798ef2.jpeg" alt="">
<img class="referenceDarkSphere" src="https://gcdn.picsart.com/editing-temp/dd3f4b13-cf07-4b77-9734-b967c196c7b9.jpeg" alt="">
<video class="referenceFireVideo" id="fireVideo" src="https://gcdn.picsart.com/editing-temp/e7b7c98c-1d64-453c-aa79-4f44097aef78.mp4" autoplay muted loop playsinline preload="auto"></video>
<canvas class="codeFireCanvas" id="fireCanvas" aria-hidden="true"></canvas>
  </div>
  <input class="range" id="range" type="range" min="0" max="100" value="62" aria-label="Енергія">
 </div>
</section>

<section id="ritual" class="screen ritual">
 <div class="ritualInner">
  <div class="formCol">
   <h2>ПРОКЛЯТТЯ ОНЛАЙН</h2>
   <p class="ritualSub">Введіть імʼя, причину і покарання</p>
   <form id="ritualForm">
    <label><span>Кого проклинаємо?</span><input id="who" maxlength="80"></label>
    <label><span>Що вона(він) зробила(в)?</span><input id="why" maxlength="140"></label>
    <label><span>Яка кара?</span><div class="randomWrap"><input id="punishment" maxlength="140"><button id="random" type="button">↻</button></div></label>
    <button class="submit" type="submit">Проклясти</button>
   </form>
  </div>
  <div class="potCol"><img class="pot" src="./assets/cauldron-reference.jpg" alt=""></div>
 </div>
</section>
<section id="casting" class="screen casting"><div class="castingInner"><div class="spellRing">✦</div><h2>ЗАКЛЯТТЯ НАКЛАДАЄТЬСЯ</h2><p id="castingText">Всесвіт уже отримав запит…</p><div class="castingBar"><i></i></div></div></section>
<section id="certificate" class="screen certificate"><div class="certWrap"><div class="certCard"><div class="certSigil">✦</div><p class="certKicker">ЦИФРОВИЙ СЕРТИФІКАТ</p><h2>ПРОКЛЯТТЯ НАКЛАДЕНО</h2><div class="certLine"><span>Кого:</span><b id="certWho"></b></div><div class="certLine"><span>Причина:</span><b id="certWhy"></b></div><div class="certLine"><span>Кара:</span><b id="certPunishment"></b></div><p class="certNo">№ <b id="certNumber"></b></p></div><div class="certActions"><button class="pill red" id="shareCert">Поділитися</button><button class="pill gray" id="again">Ще одне прокляття</button><button class="undo" id="undoCurse">Скасувати прокляття</button></div></div></section>
<div class="toast" id="toast"></div>
</main><script src="./script.js?v=24"></script></body></html>
